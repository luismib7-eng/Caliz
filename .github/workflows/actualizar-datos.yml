name: Actualizar precios de combustibles

"on":
  workflow_dispatch:
    inputs:
      url_xml:
        description: "URL del XML (opcional, para probar otro origen)"
        required: false
        default: ""
  schedule:
    # Diario 13:00 UTC = 07:00 en el centro de Mexico
    - cron: "0 13 * * *"
    # Lunes 14:00 UTC = 08:00 en el centro de Mexico (corte semanal)
    - cron: "0 14 * * 1"

permissions:
  contents: write

env:
  # Endpoint de datos de la Comision Nacional de Energia.
  # Se puede sobrescribir en Settings > Secrets and variables > Actions > Variables
  # con la variable URL_XML, o al lanzarlo a mano con el campo de arriba.
  URL_POR_OMISION: "https://publicacionexterna.azurewebsites.net/publicaciones/prices"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar el XML oficial
        id: descarga
        run: |
          URL="${{ github.event.inputs.url_xml }}"
          [ -z "$URL" ] && URL="${{ vars.URL_XML }}"
          [ -z "$URL" ] && URL="$URL_POR_OMISION"
          echo "Origen: $URL"

          # -w imprime el diagnostico aunque la descarga falle; sin -f para
          # poder leer el codigo HTTP en lugar de morir en silencio.
          CODIGO=$(curl -sSL --retry 3 --retry-all-errors --max-time 120 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36" \
            -H "Accept: application/xml,text/xml,*/*" \
            -o precios_del_dia.xml -w "%{http_code}" "$URL" || echo "000")

          BYTES=$(wc -c < precios_del_dia.xml 2>/dev/null || echo 0)
          echo "HTTP $CODIGO · $BYTES bytes"

          # El archivo real pesa ~2.5 MB y empieza con <precios ...>.
          # Una pagina de error o un reto de WAF pesa unos pocos KB y es HTML.
          if [ "$CODIGO" != "200" ] || [ "$BYTES" -lt 100000 ] || ! head -c 400 precios_del_dia.xml | grep -qi "<precios"; then
            echo "::warning::Descarga no valida (HTTP $CODIGO, $BYTES bytes). Primeros bytes:"
            head -c 300 precios_del_dia.xml || true
            echo ""
            echo "omitir=1" >> "$GITHUB_OUTPUT"
          else
            echo "omitir=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Convertir, acumular y generar el reporte de mercado
        if: steps.descarga.outputs.omitir == '0'
        run: |
          python3 xml_a_csv.py precios_del_dia.xml \
                  --catalogo catalogo_estaciones.csv \
                  --salida fallback.csv \
                  --acumular --conservar 7 \
                  --historico historico.csv --historico-conservar 120 \
                  --reporte reporte_mercado.csv

      - name: Publicar si hubo cambios
        if: steps.descarga.outputs.omitir == '0'
        run: |
          rm -f precios_del_dia.xml
          if git diff --quiet -- fallback.csv historico.csv reporte_mercado.csv; then
            echo "Sin cambios: la fecha ya estaba cargada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fallback.csv historico.csv reporte_mercado.csv
          git commit -m "Precios $(date -u +%Y-%m-%d)"
          git push

      - name: Resumen de la corrida
        if: always()
        run: |
          rm -f precios_del_dia.xml
          if [ "${{ steps.descarga.outputs.omitir }}" = "1" ]; then
            echo "### Sin datos nuevos" >> "$GITHUB_STEP_SUMMARY"
            echo "El origen no entrego un XML valido en esta corrida." >> "$GITHUB_STEP_SUMMARY"
            echo "Revisa el paso *Descargar el XML oficial* para ver el codigo HTTP." >> "$GITHUB_STEP_SUMMARY"
            echo "El tablero sigue sirviendo el ultimo corte publicado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Datos actualizados" >> "$GITHUB_STEP_SUMMARY"
            echo "Periodos en fallback.csv: $(cut -d, -f1 fallback.csv | tail -n +2 | sort -u | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          fi

# ---------------------------------------------------------------
#  NOTAS
#
#  Ruta obligatoria dentro del repositorio:
#      .github/workflows/actualizar-datos.yml
#
#  Antes de la primera corrida:
#    Settings > Actions > General > Workflow permissions:
#       marca "Read and write permissions".
#    La variable URL_XML es OPCIONAL: si no existe se usa URL_POR_OMISION.
#
#  Diagnostico: pestaña Actions > Run workflow. El paso de descarga
#  imprime el codigo HTTP y el tamaño, y si algo falla la corrida
#  termina en verde con un aviso, sin borrar los datos publicados.
#
#  Sobre los dos archivos de datos:
#    fallback.csv   padron completo, ventana movil de 7 cortes.
#    historico.csv  promedios diarios por ambito y producto (120 cortes).
#    reporte_mercado.csv  metricas estilo Profeco.
# ---------------------------------------------------------------
