name: Actualizar precios de combustibles

"on":
  workflow_dispatch:
    inputs:
      url_xml:
        description: "URL del XML (opcional, para probar otro origen)"
        required: false
        default: ""
  schedule:
    # Diario 13:00 UTC = 07:00 en el centro de Mexico
    - cron: "0 13 * * *"
    # Lunes 14:00 UTC = 08:00 en el centro de Mexico (corte semanal)
    - cron: "0 14 * * 1"

permissions:
  contents: write

env:
  # Endpoint de datos de la Comision Nacional de Energia.
  # OJO: la ruta va SIN acentos -> /publicaciones/prices
  URL_POR_OMISION: "https://publicacionexterna.azurewebsites.net/publicaciones/prices"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar el XML oficial
        id: descarga
        run: |
          URL="${{ github.event.inputs.url_xml }}"
          if [ -z "$URL" ]; then URL="${{ vars.URL_XML }}"; fi
          if [ -z "$URL" ]; then URL="$URL_POR_OMISION"; fi
          echo "Origen: $URL"

          # Sin -f para poder leer el codigo HTTP en lugar de morir en silencio.
          CODIGO=$(curl -sSL --retry 3 --retry-all-errors --max-time 180 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36" \
            -H "Accept: application/xml,text/xml,*/*" \
            -o precios_del_dia.xml -w "%{http_code}" "$URL" || echo "000")

          BYTES=$(wc -c < precios_del_dia.xml 2>/dev/null || echo 0)
          echo "HTTP $CODIGO · $BYTES bytes"

          # Validacion: codigo 200, tamano razonable y contenido correcto.
          # La etiqueta se busca en TODO el archivo, no en los primeros bytes:
          # puede venir con BOM, comentarios o una declaracion XML larga antes
          # del nodo raiz, y por eso una descarga buena se rechazaba.
          VALIDO=1
          if [ "$CODIGO" != "200" ]; then VALIDO=0; fi
          if [ "$BYTES" -lt 100000 ]; then VALIDO=0; fi
          if ! grep -qi "<estacion" precios_del_dia.xml; then VALIDO=0; fi

          if [ "$VALIDO" = "1" ]; then
            echo "Descarga valida."
            echo "omitir=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Descarga no valida (HTTP $CODIGO, $BYTES bytes). El tablero conserva el corte previo."
            echo "Primeros 200 bytes en hexadecimal (revela BOM o HTML de error):"
            head -c 200 precios_del_dia.xml | od -c | head -8 || true
            echo "omitir=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Convertir, acumular y generar el reporte de mercado
        if: steps.descarga.outputs.omitir == '0'
        run: |
          python3 xml_a_csv.py precios_del_dia.xml \
                  --catalogo catalogo_estaciones.csv \
                  --salida fallback.csv \
                  --acumular --conservar 7 \
                  --historico historico.csv --historico-conservar 120 \
                  --reporte reporte_mercado.csv

      - name: Publicar si hubo cambios
        if: steps.descarga.outputs.omitir == '0'
        run: |
          rm -f precios_del_dia.xml
          if git diff --quiet -- fallback.csv historico.csv reporte_mercado.csv; then
            echo "Sin cambios: la fecha ya estaba cargada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fallback.csv historico.csv reporte_mercado.csv
          git commit -m "Precios $(date -u +%Y-%m-%d)"
          git push

      - name: Resumen de la corrida
        if: always()
        run: |
          rm -f precios_del_dia.xml
          if [ "${{ steps.descarga.outputs.omitir }}" = "1" ]; then
            {
              echo "### Sin datos nuevos"
              echo "El origen no entrego un XML valido en esta corrida."
              echo "Revisa el paso *Descargar el XML oficial* para ver el codigo HTTP."
              echo "El tablero sigue sirviendo el ultimo corte publicado."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Datos actualizados"
              echo "Periodos en fallback.csv: $(cut -d, -f1 fallback.csv | tail -n +2 | sort -u | tr '\n' ' ')"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
