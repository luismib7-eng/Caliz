name: Actualizar precios de combustibles

on:
  workflow_dispatch: {}
  schedule:
    # Diario 13:00 UTC = 07:00 CDMX
    - cron: "0 13 * * *"
    # Lunes 14:00 UTC = 08:00 CDMX
    - cron: "0 14 * * 1"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar XML oficial de la CNE
        env:
          URL_CONFIGURADA: ${{ vars.URL_XML }}
        run: |
          URL="${URL_CONFIGURADA:-https://www.cne.gob.mx/media/precios/precios.xml}"
          echo "Descargando desde: $URL"
          
          curl -sSL --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 60 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" \
            -H "Accept: application/xml,text/xml,*/*" \
            -o precios_del_dia.xml "$URL"
          
          # Validar que el archivo descargado sea un XML válido y no esté vacío
          if [ ! -s precios_del_dia.xml ] || ! head -n 5 precios_del_dia.xml | grep -q "<"; then
            echo "::error::El archivo descargado no es un XML válido o el portal está inaccesible."
            head -n 20 precios_del_dia.xml
            exit 1
          fi
          echo "XML descargado exitosamente ($(stat -c%s precios_del_dia.xml) bytes)."

      - name: Convertir, acumular y generar reporte
        run: |
          GEO_ARGS=""
          if [ -f "entidades_mx.geojson" ]; then GEO_ARGS="$GEO_ARGS --geojson entidades_mx.geojson"; fi
          if [ -f "municipios_mx.topojson" ]; then GEO_ARGS="$GEO_ARGS --municipios municipios_mx.topojson"; fi
          
          python3 xml_a_csv.py precios_del_dia.xml \
                  --catalogo catalogo_estaciones.csv \
                  --salida fallback.csv \
                  --acumular --conservar 7 \
                  --historico historico.csv --historico-conservar 120 \
                  --reporte reporte_mercado.csv \
                  $GEO_ARGS

      - name: Publicar cambios en el repositorio
        run: |
          rm -f precios_del_dia.xml
          
          if git diff --quiet -- fallback.csv historico.csv reporte_mercado.csv catalogo_estaciones.csv; then
            echo "Sin cambios: la fecha ya estaba cargada."
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fallback.csv historico.csv reporte_mercado.csv
          if [ -f "catalogo_estaciones.csv" ]; then git add catalogo_estaciones.csv; fi
          
          git commit -m "Precios actualizados: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main || git push
